name: NevaGiveUp CI

on:
  push:
    branches:
      - CI/CD

  pull_request:
    branches:
      - main

jobs:

  Frontend:
    
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: Frontend-nextjs

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: Frontend-nextjs/package-lock.json

        - name: install dependencies for Backend
          run: npm ci
          working-directory: Backend-nestjs

        - name: Install dependencies for Frontend
          run: npm ci

        - name: Generate Prisma Client
          run: npx prisma generate --schema=../Backend-nestjs/prisma/schema.prisma

        - name: Build
          run: npm run build

  Backend:

      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: Backend-nestjs

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: Backend-nestjs/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Generate Prisma Client
          run: npx prisma generate --schema=prisma/schema.prisma

        - name: Build
          run: npm run build
