name: NevaGiveUp CI

on:
  push:
    branches:
      - CI/CD

  pull_request:
    branches:
      - main

jobs:

  Frontend:
    
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: Frontend-nextjs

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: Frontend-nextjs/package-lock.json

        - name: install dependencies for Backend
          run: npm ci
          working-directory: Backend-nestjs

        - name: Install dependencies for Frontend
          run: npm ci

        - name: Generate Prisma Client
          run: npx prisma generate --schema=../Backend-nestjs/prisma/schema.prisma

        - name: Build
          run: npm run build

  Backend:

      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:17
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: NevaGiveUp
          ports:
            - 5432:5432

      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/NevaGiveUp
        JWT_SECRET: ci-test-secret-change-me-123456
        
      defaults:
        run:
          working-directory: Backend-nestjs

      steps:
        - name: Checkout
          uses: actions/checkout@v4
        
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: Backend-nestjs/package-lock.json
            
        - name: Install dependencies
          run: npm ci

        - name: Generate Prisma Client
          run: npx prisma generate --schema=prisma/schema.prisma

        - name: Run Migrations
          run: npx prisma migrate deploy --schema=prisma/schema.prisma

        - name: Run seed
          run: npx prisma db seed --schema=prisma/schema.prisma

        - name: Run test E2E
          run: npm run test:e2e

        - name: Build
          run: npm run build
